<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6ede7">
  <title>Quiz Tricorumi | Descubra sua fase no tricô</title>
  <meta name="description" content="Descubra qual caminho do Tricorumi combina com a sua fase atual.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#4b3832;--muted:#765f57;--rose:#b76575;--rose-dark:#914a5b;
      --blush:#f1d7d8;--sand:#f6ede7;--cream:#fffaf6;--white:#fff;
      --line:#ead8d0;--shadow:0 22px 60px rgba(83,53,45,.14);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden}
    body{
      font-family:"Comfortaa",sans-serif;color:var(--ink);
      background:
        radial-gradient(circle at 8% 12%,rgba(241,215,216,.9),transparent 28%),
        radial-gradient(circle at 92% 88%,rgba(230,205,187,.8),transparent 28%),
        var(--sand);
    }
    button,a{font:inherit}
    button:focus-visible,a:focus-visible{outline:3px solid #d89aaa;outline-offset:3px}
    .shell{height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:max(14px,env(safe-area-inset-top)) clamp(14px,3vw,34px) max(14px,env(safe-area-inset-bottom))}
    .top{width:min(980px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:10px}
    .brand{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .brand i{font-style:normal;font-size:1.35rem}
    .progress{display:none;width:min(300px,44vw)}
    .track{height:7px;background:rgba(255,255,255,.65);border-radius:99px;overflow:hidden}
    .fill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),#d99aaa);border-radius:inherit;transition:width .35s ease}
    .progress small{display:block;margin-top:5px;text-align:right;color:var(--muted);font-size:.67rem}
    main{min-height:0;display:grid;place-items:center}
    .card{
      width:min(880px,100%);max-height:100%;overflow:hidden;background:rgba(255,250,246,.96);
      border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:var(--shadow);
      padding:clamp(22px,5vh,48px) clamp(18px,5vw,62px);text-align:center;
      animation:enter .35s ease both;
    }
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .eyebrow{display:inline-block;color:var(--rose-dark);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
    h1,h2,h3,p{margin-top:0}
    h1,h2{font-family:"Amatic SC",cursive;line-height:.92;color:var(--rose-dark)}
    h1{font-size:clamp(3rem,8vw,5.6rem);margin-bottom:14px}
    h2{font-size:clamp(2.25rem,5.5vw,4rem);margin-bottom:14px}
    h3{font-size:clamp(1.15rem,2.8vw,1.6rem);line-height:1.35;margin-bottom:20px}
    p{line-height:1.6;color:var(--muted);font-size:clamp(.86rem,1.7vw,1rem)}
    .lead{max-width:670px;margin:0 auto 24px}
    .micro{margin:12px 0 0;font-size:.72rem}
    .btn{
      border:0;border-radius:16px;padding:14px 22px;min-height:50px;cursor:pointer;text-decoration:none;
      display:inline-flex;align-items:center;justify-content:center;font-weight:700;transition:.2s ease;
    }
    .btn:hover{transform:translateY(-2px)}
    .primary{color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose-dark));box-shadow:0 10px 24px rgba(145,74,91,.24)}
    .ghost{color:var(--rose-dark);background:#fff;border:1px solid var(--line)}
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;text-align:left}
    .answer{
      width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);
      padding:13px 15px;min-height:58px;cursor:pointer;line-height:1.35;font-weight:600;font-size:clamp(.76rem,1.5vw,.9rem);
      transition:.18s ease;
    }
    .answer:hover{border-color:#cf8e9c;background:#fff7f7;transform:translateY(-1px)}
    .answer b{display:block;color:var(--rose-dark);margin-bottom:3px;font-size:.9em}
    .question-heading{display:grid;grid-template-columns:108px 1fr;align-items:center;gap:18px;margin-bottom:15px;text-align:left}
    .question-heading h3{margin:0}
    .question-animal{
      width:108px;height:108px;object-fit:cover;object-position:center 62%;border-radius:22px;
      border:4px solid #fff;box-shadow:0 10px 26px rgba(83,53,45,.16)
    }
    .visual-showcase{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 18px}
    .visual-showcase figure{margin:0;position:relative}
    .visual-showcase img{
      width:84px;height:84px;object-fit:cover;object-position:center 68%;border-radius:20px;
      border:3px solid #fff;box-shadow:0 8px 22px rgba(83,53,45,.14)
    }
    .visual-showcase figure:nth-child(2){transform:translateY(-5px)}
    .visual-showcase figcaption{position:absolute;inset:auto 4px 4px;padding:3px 5px;border-radius:8px;background:rgba(75,56,50,.78);color:#fff;font-size:.46rem;font-weight:700}
    .message-card{max-width:720px}
    .message-icon{font-size:clamp(2.6rem,7vw,4.5rem);display:block;margin-bottom:12px}
    .message-card p{max-width:590px;margin:0 auto 24px}
    .message-product{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:clamp(18px,4vw,34px);text-align:left}
    .product-preview{margin:0;position:relative}
    .product-preview img{
      width:180px;height:180px;object-fit:cover;object-position:center 68%;border-radius:24px;
      border:4px solid #fff;box-shadow:0 14px 34px rgba(83,53,45,.18)
    }
    .product-preview figcaption{margin-top:8px;text-align:center;color:var(--rose-dark);font-size:.68rem;font-weight:700}
    .message-copy h2{font-size:clamp(2.15rem,5vw,3.5rem)}
    .message-copy p{margin:0 0 18px;max-width:none}
    .result-animal{width:74px;height:74px;object-fit:cover;object-position:center 68%;border-radius:20px;border:3px solid #fff;box-shadow:0 8px 18px rgba(83,53,45,.14);margin-bottom:8px}
    .result-card{padding-top:clamp(18px,3.5vh,34px);padding-bottom:clamp(18px,3.5vh,34px)}
    .result-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(18px,4vw,38px);align-items:center;text-align:left}
    .result-layout h2{font-size:clamp(2.5rem,5vw,4.3rem);margin-bottom:7px}
    .result-layout p{font-size:clamp(.76rem,1.4vw,.91rem);margin-bottom:12px}
    .price{display:flex;align-items:baseline;gap:8px;color:var(--rose-dark);margin:8px 0 13px}
    .price strong{font-size:clamp(1.65rem,4vw,2.5rem)}
    .price span{font-size:.76rem;color:var(--muted)}
    .included{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
    .included li{font-size:clamp(.7rem,1.35vw,.84rem);line-height:1.35}
    .included li::before{content:"✓";color:var(--rose);font-weight:700;margin-right:7px}
    .product-showcase{margin:10px 0 13px;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:#fffaf7}
    .product-showcase-title{display:block;margin-bottom:7px;color:var(--rose-dark);font-size:.76rem;font-weight:700}
    .project-thumbs{display:flex;gap:7px;margin-bottom:8px}
    .project-thumb{margin:0;min-width:0;flex:1;text-align:center}
    .project-thumb img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 62%;border-radius:11px;border:2px solid #fff;box-shadow:0 5px 13px rgba(83,53,45,.12)}
    .project-thumb figcaption{margin-top:3px;color:var(--muted);font-size:.45rem;line-height:1.15;font-weight:700}
    .module-note,.showcase-extra,.project-names{margin:4px 0!important;font-size:.62rem!important;line-height:1.4!important}
    .module-note{color:var(--ink)!important;font-weight:700}
    .project-names{color:var(--muted)!important}
    .showcase-extra{color:var(--rose-dark)!important;font-weight:700}
    .result-actions{display:flex;gap:9px;flex-wrap:wrap}
    .result-actions .btn{font-size:.78rem;min-height:46px;padding:12px 17px}
    .recommend{
      background:linear-gradient(145deg,#f6e2df,#ead0ca);border-radius:23px;padding:clamp(18px,3vw,28px);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.65)
    }
    .recommend .stamp{font-size:2.3rem;display:block;margin-bottom:7px}
    .recommend strong{display:block;color:var(--rose-dark);margin-bottom:8px}
    .guarantee{font-size:.68rem!important;margin:9px 0 0!important}
    .other-title{margin:14px 0 7px!important;font-size:.7rem!important;font-weight:700;color:var(--ink)!important}
    .other-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .other-option{
      min-width:0;padding:8px 7px;border:1px solid var(--line);border-radius:11px;background:#fff;
      color:var(--rose-dark);text-decoration:none;text-align:center;font-size:.58rem;line-height:1.3;font-weight:700;
    }
    .other-option span{display:block;margin-top:2px;color:var(--muted);font-size:.52rem;font-weight:500}
    .other-option:hover{border-color:#cf8e9c;background:#fff7f7}
    .back{position:fixed;left:18px;bottom:14px;border:0;background:transparent;color:var(--muted);font-size:.72rem;cursor:pointer}
    @media(max-width:640px){
      .shell{padding-left:12px;padding-right:12px}
      .top{padding-bottom:7px}
      .brand span:last-child{display:none}
      .progress{width:58vw}
      .card{border-radius:22px;padding:20px 15px}
      h1{font-size:clamp(2.8rem,14vw,4rem)}
      h2{font-size:clamp(2.2rem,11vw,3.2rem)}
      h3{font-size:.98rem;margin-bottom:13px}
      .answers{grid-template-columns:1fr;gap:7px}
      .answer{min-height:48px;padding:9px 12px;font-size:.72rem}
      .question-heading{grid-template-columns:74px 1fr;gap:11px;margin-bottom:10px}
      .question-animal{width:74px;height:74px;border-radius:16px;border-width:3px}
      .visual-showcase{gap:6px;margin-bottom:12px}.visual-showcase img{width:66px;height:66px;border-radius:16px}.visual-showcase figcaption{display:none}
      .message-product{grid-template-columns:105px 1fr;gap:13px}
      .product-preview img{width:105px;height:125px;border-radius:18px}
      .product-preview figcaption{font-size:.56rem;margin-top:5px}
      .message-copy h2{font-size:2rem;margin-bottom:8px}.message-copy p{font-size:.73rem;line-height:1.45;margin-bottom:10px}
      .message-copy .btn{min-height:44px;padding:10px 15px}
      .result-layout{grid-template-columns:1fr;gap:11px}
      .recommend{padding:13px 15px}
      .recommend p{margin-bottom:5px}
      .result-actions .btn{flex:1}
      .included{grid-template-columns:1fr 1fr;gap:4px 8px}
      .included li{font-size:.62rem}
      .product-showcase{margin:6px 0 8px;padding:7px 8px}.product-showcase-title{font-size:.62rem;margin-bottom:5px}
      .project-thumbs{gap:4px;margin-bottom:5px}.project-thumb figcaption{display:none}
      .module-note,.showcase-extra,.project-names{font-size:.52rem!important;line-height:1.27!important;margin:2px 0!important}
      .other-title{margin-top:9px!important}.other-option{padding:6px 4px;font-size:.52rem}
    }
    @media(max-height:650px){
      .top{padding-bottom:5px}.card{padding-top:15px;padding-bottom:15px}
      h1{margin-bottom:7px}h2{margin-bottom:7px}h3{margin-bottom:10px}
      .lead{margin-bottom:13px}.answer{min-height:44px;padding-top:8px;padding-bottom:8px}
      .message-icon{font-size:2.4rem;margin-bottom:6px}.message-card p{margin-bottom:12px}
      .visual-showcase{margin-bottom:8px}.visual-showcase img{width:56px;height:56px}
      .question-heading{grid-template-columns:62px 1fr;gap:9px;margin-bottom:7px}.question-animal{width:62px;height:62px}
      .message-product{grid-template-columns:92px 1fr}.product-preview img{width:92px;height:104px}.product-preview figcaption{display:none}
      .message-copy h2{font-size:1.75rem}.message-copy p{font-size:.67rem;line-height:1.35}
      .product-showcase{padding:5px 6px}.project-thumbs{margin-bottom:3px}.project-names{font-size:.47rem!important}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>

        showcaseTitle:"Um clube cheio de possibilidades",
        module:"Acesso a todos os bichinhos disponíveis na biblioteca enquanto você assina.",
        extra:"Novos personagens e receitas são adicionados ao Clube — seu repertório continua crescendo.",
        gallery:[
          ["capivara-amora.png","Capivara Amora"],["coelha-aurora.png","Coelha Aurora"],["coelho-bento.png","Coelho Bento"],["urso-ludovico.png","Urso Ludovico"],["urso_oliver.png","Urso Oliver"]
        ],
        pieces:["Coelhas e coelhos","Ursos","Naninha e personagens para bebê","Animais afetivos","Projetos sazonais","Todos os novos bichinhos disponibilizados no Clube"],
        title:"Clube do Tricorumi",price:"R$ 19,90",suffix:"no primeiro mês",shortPay:"no 1º mês",
        intro:"Você é movida por novidade, inspiração e pela vontade de criar sempre mais. Imagine abrir uma biblioteca de Tricorumi e escolher, a cada novo projeto, qual personagem vai nascer das suas agulhas.",
        items:["Depois, R$ 47,90 por mês","Biblioteca completa enquanto assina","Novas receitas adicionadas","Cancele quando quiser"],
        cta:"Quero entrar no clube",url:links.clube
      },
      pdf:{
        image:"patinha.png",imageAlt:"Patinha Penélope feita em tricô",
        showcaseTitle:"Você escolhe qual bichinho quer produzir",
        module:"Clique no catálogo, veja todas as receitas disponíveis e escolha seu personagem favorito.",
        extra:"Compre somente o PDF que quiser e produza no seu ritmo.",
        gallery:[
          ["patinha.png","Pata Penélope"],["Ovelha Nina.png","Ovelha Nina"],["coelho-bento.png","Coelho Bento"],["capivara-amora.png","Capivara Amora"],["ratinha.png","Ratinha Bela"]
        ],
        pieces:[],
        title:"PDF Avulso",price:"R$ 47,90",suffix:"cada receita",shortPay:"cada receita",
        intro:"Você gosta de liberdade e já sabe o que faz seus olhos brilharem: encontrar um bichinho encantador, escolher a receita e começar. Um único personagem pode ser o início de uma paixão — o perigo é querer fazer a família inteira depois 😂.",
        items:["Escolha somente seu favorito","Receita digital passo a passo","Compre quando quiser","Ideal para testar a técnica"],
        cta:"Quero escolher um PDF",url:links.pdf
      }
    };

    const app=document.getElementById("app");
    const progress=document.getElementById("progress");
    const fill=document.getElementById("fill");
    const progressText=document.getElementById("progressText");
    let index=-1;
    let scores={completo:0,mini:0,clube:0,pdf:0};
    let answers=[];
    let techniqueAnswer="no";

    function questionPosition(){
      return screens.slice(0,index+1).filter(s=>s.type==="question").length;
    }
    function updateProgress(){
      const current=questionPosition();
      const total=screens.filter(s=>s.type==="question").length;
      progress.style.display=index>=0?"block":"none";
      fill.style.width=`${Math.max(0,(current-1)/total*100)}%`;
      progressText.textContent=current?`Pergunta ${current} de ${total}`:"";
    }
    function start(){index=0;render()}
    function render(){
      updateProgress();
      const s=screens[index];
      if(s.type==="message") return renderMessage(s);
      if(s.type==="techniqueMessage") return renderMessage(techniqueMessages[techniqueAnswer]);
      const answersHtml=s.answers.map((a,i)=>{
        const label=s.price?`<b>${a[0]}</b>${a[1]}`:a[0];
        return `<button class="answer" type="button" data-i="${i}">${label}</button>`;
      }).join("");
      const questionVisual=s.image?`<div class="question-heading">
        <img class="question-animal" src="${encodeURI(s.image)}" alt="${s.imageAlt||"Bichinho feito em tricô"}" decoding="async">
        <h3>${s.title}</h3>
      </div>`:`<h3>${s.title}</h3>`;
      app.innerHTML=`<section class="card question-card">
        <span class="eyebrow">${s.price?"Última pergunta • seu investimento":"Descubra sua fase atual no tricô"}</span>
        ${questionVisual}
        <div class="answers">${answersHtml}</div>
      </section>`;
      app.querySelectorAll(".answer").forEach(btn=>btn.onclick=()=>choose(+btn.dataset.i));
    }
    function renderMessage(s){
      const productVisual=s.image?`<div class="message-product">
        <figure class="product-preview">
          <img src="${encodeURI(s.image)}" alt="${s.imageAlt||s.character||"Bichinho feito em tricô"}" decoding="async">
          <figcaption>${s.character||"Projeto Tricorumi"}</figcaption>
        </figure>
        <div class="message-copy">
          <h2>${s.title}</h2>
          <p>${s.text}</p>
          <button class="btn primary" type="button" id="continue">Continuar</button>
        </div>
      </div>`:`<span class="message-icon">${s.icon}</span><h2>${s.title}</h2><p>${s.text}</p><button class="btn primary" type="button" id="continue">Continuar</button>`;
      app.innerHTML=`<section class="card message-card">${productVisual}</section>`;
      document.getElementById("continue").onclick=next;
    }
    function choose(i){
      const choice=screens[index].answers[i];
      if(screens[index].technique) techniqueAnswer=i===0?"yes":"no";
      const score=choice[choice.length-1];
      Object.entries(score).forEach(([k,v])=>scores[k]+=v);
      answers.push({screen:index,choice:i,score});
      next();
    }
    function next(){
      index++;
      if(index<screens.length) render(); else showResult();
    }
    function winner(){
      const priority=["completo","mini","clube","pdf"];
      return priority.sort((a,b)=>scores[b]-scores[a])[0];
    }
    function showResult(){
      progress.style.display="block";fill.style.width="100%";progressText.textContent="Resultado pronto ✨";
      const key=winner(),p=products[key];
      const alternatives=Object.entries(products).filter(([k])=>k!==key)
        .map(([k,v])=>`<a class="other-option" href="${v.url}" target="_blank" rel="noopener">${v.title}<span>${v.price} ${v.shortPay}</span></a>`).join("");
      const projectThumbs=p.gallery.map(([src,name])=>`<figure class="project-thumb">
        <img src="${encodeURI(src)}" alt="${name} feito em tricô" decoding="async">
        <figcaption>${name}</figcaption>
      </figure>`).join("");
      const projectNames=p.pieces.length?`<p class="project-names"><strong>Peças:</strong> ${p.pieces.join(" • ")}</p>`:"";
      const showcase=`<section class="product-showcase" aria-label="Conteúdo incluído em ${p.title}">
        <strong class="product-showcase-title">${p.showcaseTitle}</strong>
        <div class="project-thumbs">${projectThumbs}</div>
        <p class="module-note">🧶 ${p.module}</p>
        ${projectNames}
        <p class="showcase-extra">${p.extra}</p>
      </section>`;
      app.innerHTML=`<section class="card result-card">
        <div class="result-layout">
          <div>
            <span class="eyebrow">Seu melhor próximo passo</span>
            <h2>${p.title}</h2>
            <p>${p.intro}</p>
            <div class="price"><strong>${p.price}</strong><span>${p.suffix}</span></div>
            ${showcase}
            <div class="result-actions">
              <a class="btn primary" href="${p.url}" target="_blank" rel="noopener">${p.cta}</a>
              <button class="btn ghost" type="button" id="restart">Refazer quiz</button>
            </div>
            <p class="other-title">Mudou de ideia? Você também pode escolher:</p>
            <div class="other-options">${alternatives}</div>
          </div>
          <aside class="recommend">
            <img class="result-animal" src="${encodeURI(p.image)}" alt="${p.imageAlt}" decoding="async">
            <strong>Por que combina com você?</strong>
            <p>A indicação considera seu nível, sua forma de aprender, seu objetivo e o investimento que faz sentido agora — não apenas a última resposta.</p>
            <p><strong>Garantia de 7 dias.</strong> Você pode conhecer o conteúdo e decidir com tranquilidade.</p>
            <p class="guarantee">A técnica ainda é pouco conhecida por muitas artesãs e está ganhando mercado pelo apelo afetivo e visual.</p>
          </aside>
        </div>
      </section>`;
      document.getElementById("restart").onclick=restart;
    }
    function restart(){
      index=0;scores={completo:0,mini:0,clube:0,pdf:0};answers=[];techniqueAnswer="no";
      render();
    }
    function renderIntro(){
      progress.style.display="none";
      app.innerHTML=`<section class="card">
        <span class="eyebrow">Quiz rápido • resultado personalizado</span>
        <h1>Descubra sua fase atual no tricô</h1>
        <p class="lead">Em poucos passos, descubra se o melhor caminho para você é o curso completo, o mini curso, o clube de assinaturas ou um PDF avulso.</p>
        <button class="btn primary" type="button" id="start">Descobrir meu caminho</button>
        <p class="micro">Leva cerca de 2 minutos • sem cadastro • resultado na hora</p>
      </section>`;
      document.getElementById("start").onclick=start;
    }
    index=0;
    render();
  </script>
</body>
</html>
